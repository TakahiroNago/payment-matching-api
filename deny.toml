# cargo-deny: advisories, licenses, duplicate versions and sources of the dependency tree.

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The crates of this workspace depend on each other by path, without a version. None of them is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
