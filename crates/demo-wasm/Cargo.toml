[package]
name = "payment-matching-demo"
description = "The matching rules of payment-matching-api as WebAssembly, for the browser demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib for the browser; rlib so that the server's tests can compare the demo with the API.
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
payment-matching-domain = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
wasm-bindgen = "0.2"

[lints]
workspace = true
