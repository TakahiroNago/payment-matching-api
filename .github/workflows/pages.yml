name: Demo (GitHub Pages)

# Builds the browser demo (demo/ and the WebAssembly package of crates/demo-wasm) and publishes it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml, as in CI.
      - name: Install the Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build the wasm package
        run: wasm-pack build crates/demo-wasm --target web --release --out-dir ../../demo/pkg --no-pack
      - name: Drop the generated .gitignore so the package is uploaded
        run: rm -f demo/pkg/.gitignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
