name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / sqlx / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_matching
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payment_matching"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/payment_matching
    steps:
      - uses: actions/checkout@v4
      # The version comes from rust-toolchain.toml, the same one everybody builds with.
      - name: Install the Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustc --version
      - name: The Dockerfile builds with the same Rust
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          grep -q "^FROM rust:${channel}-" Dockerfile
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      # Offline: every query in the code must have its metadata committed in .sqlx.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked
      - name: Apply migrations
        run: sqlx migrate run
      # Online: the committed metadata must agree with the migrations.
      - name: sqlx prepare --check
        run: cargo sqlx prepare --check -- --all-targets
      - name: test
        run: cargo test --workspace --locked
      # The browser demo: the rules without the server's dependencies, for wasm32. Published by pages.yml.
      - name: The demo compiles to WebAssembly
        run: cargo build -p payment-matching-demo --target wasm32-unknown-unknown --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          echo "API_TOKEN=ci-token-0123456789abcdef" > .env
          docker compose build
      - name: Smoke test
        run: |
          docker compose up -d db
          docker compose run --rm api migrate
          docker compose up -d api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/readyz | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/payments)" = "401"
          curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdef' http://127.0.0.1:8080/v1/payments | grep -q '"items":\[\]'
          docker compose down -v
