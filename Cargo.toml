[package]
name = "payment-matching-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Matches bank payments against open invoices: an axum + sqlx + PostgreSQL API"
license = "MIT"
repository = "https://github.com/TakahiroNago/payment-matching-api"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json"] }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "ansi"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
proptest = "1.12.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
