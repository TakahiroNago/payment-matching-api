# The server is the root package. `crates/domain` holds the logic without I/O, so that `crates/demo-wasm` can
# compile it to WebAssembly for the browser demo.
[workspace]
members = [".", "crates/domain", "crates/demo-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/TakahiroNago/payment-matching-api"

[workspace.dependencies]
payment-matching-domain = { path = "crates/domain" }
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "json"] }
time = { version = "0.3.55", features = ["serde", "macros", "formatting", "parsing"] }
uuid = { version = "1.29.3", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[package]
name = "payment-matching-api"
description = "Matches bank payments against open invoices: an axum + sqlx + PostgreSQL API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
payment-matching-domain = { workspace = true, features = ["server"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.1"
sqlx = { workspace = true }
subtle = "2.6.1"
thiserror = "2.0.21"
time = { workspace = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "ansi"] }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = "0.1.5"
payment-matching-demo = { path = "crates/demo-wasm" }
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
